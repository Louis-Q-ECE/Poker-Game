<title>Spin Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7ecd9; --panel:#fff8ec; --panel2:#ffe9c2; --line:#e3cda3;
  --text:#3d2c19; --muted:#8a7355;
  --gold:#ffc93c; --gold2:#e8890f; --oxblood:#e8495a; --green:#3ddc84; --red:#ff5c6c;
  --ink:#3d2c19;
  --disp:'Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{height:100%;background:radial-gradient(ellipse at 50% -10%,#fffaf0 0%,#f7ecd9 45%,#ecd9b6 100%);color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:transparent;color:var(--text);font:500 16px/1.35 var(--body);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#app{height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.hidden{display:none!important}
.coin,.chip{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.15em;margin-right:.3em;flex:none;position:relative}

/* pièce d'or générique (monnaie du jeu, hors mise) */
.coin{
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,0) 24%),
    radial-gradient(circle at 38% 32%,#fff6d2 0%,#f4cb5c 38%,#d99a1e 72%,#a36c10 100%);
  box-shadow:
    inset 0 0 0 .07em rgba(255,244,204,.65),
    inset 0 0 0 .13em rgba(130,84,10,.55),
    inset 0 -.09em .1em rgba(0,0,0,.35),
    inset 0 .05em .05em rgba(255,255,255,.4),
    0 .05em .09em rgba(0,0,0,.4)}

/* jeton de mise façon casino : liseré à pastilles colorées selon la dénomination */
.chip{
  --cv:#b81f2e; --tv:#f6f1e6;
  margin-right:.28em;
  background:
    radial-gradient(circle at 32% 26%,rgba(255,255,255,.5) 0 6%,rgba(255,255,255,0) 28%),
    radial-gradient(circle,var(--cv) 0 60%,var(--tv) 61% 74%,var(--cv) 75% 84%,transparent 85% 100%),
    repeating-conic-gradient(var(--tv) 0deg 22.5deg,var(--cv) 22.5deg 45deg),
    var(--cv);
  box-shadow:
    inset 0 -.08em .09em rgba(0,0,0,.4),
    inset 0 .04em .05em rgba(255,255,255,.3),
    0 .05em .09em rgba(0,0,0,.4),
    0 0 0 .045em rgba(0,0,0,.5)}
.pot .chip,.bet .chip{margin-right:.24em}

/* ---------- HUB ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
.me{display:flex;align-items:center;gap:10px}
.me .av{width:44px;height:44px;font-size:25px;background:#ffe17a;border:1.5px solid var(--ink);box-shadow:0 1px 5px rgba(0,0,0,0.3)}
.me b{display:block;font:700 18px/1 var(--disp);letter-spacing:.01em}
.me small{color:var(--muted);font-size:12px}
.wallet{font:700 24px/1 var(--disp);color:#3a2d0a;background:linear-gradient(#ffe17a,#ffc93c);border:1.5px solid var(--ink);border-radius:999px;padding:6px 15px 5px;box-shadow:0 1px 5px rgba(0,0,0,0.3)}
#hubBody{flex:1;overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:#ffe9c2;border-top:3px solid var(--ink)}
.tabs button{background:none;border:0;color:var(--muted);padding:11px 0 10px;font:700 13.5px var(--disp);letter-spacing:0}
.tabs button.on{color:var(--gold2);box-shadow:inset 0 4px 0 var(--gold)}
h2{font:700 28px/1.05 var(--disp);margin:8px 0 4px;letter-spacing:0;color:var(--gold2);text-shadow:0 1px 5px rgba(0,0,0,0.3)}
h3{font:700 20px/1.1 var(--disp);margin:22px 0 8px;letter-spacing:0;color:#fff}
.lead{color:var(--muted);margin:0 0 14px;font-size:14.5px;font-weight:600}
.banner{background:linear-gradient(100deg,#ffd76a,#ffb23c);border:1.5px solid var(--ink);border-radius:13px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 7px rgba(0,0,0,0.26);color:#3a2308}
.banner p{margin:0;font-size:14.5px;font-weight:700}
.btn{border:1.5px solid var(--ink);border-radius:11px;padding:10px 16px;font:700 18px var(--disp);letter-spacing:.01em;color:#3a2308;background:linear-gradient(#ffe17a,#ffc93c);box-shadow:0 2px 3px rgba(185,134,15,.5),0 3px 8px rgba(0,0,0,.2);transform:translateY(0);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(185,134,15,.45),0 1px 3px rgba(0,0,0,.16)}
.btn:disabled{background:#4b436e;color:#8b83ab;border-color:#332a5c;box-shadow:none}
.btn.ghost{background:var(--panel2);color:var(--text);border:1.5px solid var(--ink);box-shadow:0 2px 3px rgba(0,0,0,.16),0 3px 8px rgba(0,0,0,.14)}
.btn.ghost:active{box-shadow:0 1px 2px rgba(0,0,0,.14)}
.btn.danger{background:linear-gradient(#ff7a86,#e8495a);color:#3a0509;border-color:var(--ink);box-shadow:0 2px 3px rgba(156,36,48,.5),0 3px 8px rgba(0,0,0,.2)}
.btn.danger:active{box-shadow:0 1px 2px rgba(156,36,48,.45),0 1px 3px rgba(0,0,0,.16)}
.tier{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--panel);border:1.5px solid var(--ink);border-left:9px solid var(--tc);border-radius:13px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 7px rgba(0,0,0,0.24)}
.tier.locked{opacity:.75}
.tname{font:800 25px/1 var(--disp);color:var(--tc);text-shadow:0 1px 2px rgba(0,0,0,0.34)}
.tbuy{font:600 20px/1.1 var(--disp);color:var(--gold2)}
.tinfo{grid-column:1;color:var(--muted);font-size:13.5px}
.tier .btn{grid-column:2;grid-row:1/3;min-width:112px}
.bar{height:8px;border-radius:99px;background:#e6d3ac;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.card-box{background:var(--panel);border:1.5px solid var(--ink);border-radius:13px;padding:12px 14px;box-shadow:0 2px 7px rgba(0,0,0,0.24)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--panel);border:1.5px solid var(--ink);border-radius:13px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 2px 7px rgba(0,0,0,0.24)}
.item.eq{border-color:var(--gold);box-shadow:0 2px 7px rgba(0,0,0,0.24),0 0 0 3px rgba(255,201,60,.3)}
.item .nm{font:600 16px var(--disp)}
.item .btn{width:100%;padding:8px 6px;font-size:15px}
.pv{height:74px;display:flex;align-items:center;justify-content:center}
.pvfelt{width:100%;height:62px;border-radius:9px;border:2px solid rgba(255,255,255,.12)}
.pvav{font-size:46px;line-height:1}
.pvdeck{display:flex;gap:4px}
.pvdeck .card,.pv .card{--w:40px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600}
td:last-child,th:last-child{text-align:right}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1.5px solid var(--ink);border-radius:11px;padding:10px 12px;box-shadow:0 1px 5px rgba(0,0,0,0.24)}
.stat b{display:block;font:800 25px/1.1 var(--disp);color:var(--gold2)}
.stat span{color:var(--muted);font-size:13px}

  transform-origin:50% 0;transform:translateX(-50%) rotate(var(--fl,0deg));transition:transform .07s;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}

"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

}

function pack(cat,arr){ let s=cat; for(let i=0;i<5;i++) s=s*16+(arr[i]||0); return s; }
function straightHigh(mask){
  for(let h=12;h>=4;h--){ if(((mask>>(h-4))&31)===31) return h; }
  if((mask&15)===15 && ((mask>>12)&1)) return 3;
  return -1;
}
// Évalue 5 à 7 cartes (0..51 ; rang = c%13, couleur = floor(c/13)) -> score comparable
function eval7(cards){
  const rc=new Array(13).fill(0), sm=[0,0,0,0], sn=[0,0,0,0]; let mask=0;
  for(let i=0;i<cards.length;i++){ const c=cards[i], r=c%13, s=(c/13)|0; rc[r]++; sm[s]|=1<<r; sn[s]++; mask|=1<<r; }
  let fs=-1; for(let s=0;s<4;s++) if(sn[s]>=5) fs=s;
  if(fs>=0){ const h=straightHigh(sm[fs]); if(h>=0) return pack(8,[h]); }
  const quads=[],trips=[],pairs=[];
  for(let r=12;r>=0;r--){ if(rc[r]===4) quads.push(r); else if(rc[r]===3) trips.push(r); else if(rc[r]===2) pairs.push(r); }
  const kick=(ex,n)=>{ const o=[]; for(let r=12;r>=0&&o.length<n;r--) if(rc[r]>0&&ex.indexOf(r)<0) o.push(r); return o; };
  if(quads.length) return pack(7,[quads[0]].concat(kick([quads[0]],1)));
  if(trips.length && (trips.length>1||pairs.length)){
    const t=trips[0]; let p=pairs.length?pairs[0]:-1; if(trips.length>1) p=Math.max(p,trips[1]);
    return pack(6,[t,p]);
  }
  if(fs>=0){ const rk=[]; for(let r=12;r>=0&&rk.length<5;r--) if((sm[fs]>>r)&1) rk.push(r); return pack(5,rk); }
  const sh=straightHigh(mask); if(sh>=0) return pack(4,[sh]);
  if(trips.length) return pack(3,[trips[0]].concat(kick([trips[0]],2)));
  if(pairs.length>=2) return pack(2,[pairs[0],pairs[1]].concat(kick([pairs[0],pairs[1]],1)));
  if(pairs.length===1) return pack(1,[pairs[0]].concat(kick([pairs[0]],3)));
  return pack(0,kick([],5));
}
function handLabel(score){
  const cat=Math.floor(score/1048576), r1=(score>>16)&15, r2=(score>>12)&15;
  switch(cat){
    case 0: return 'Carte haute '+RS[r1];
    case 1: return 'Paire de '+RN[r1];
    case 2: return 'Double paire '+RN[r1]+' et '+RN[r2];
    case 3: return 'Brelan de '+RN[r1];
    case 4: return 'Quinte '+RS[r1]+' haute';
    case 5: return 'Couleur';
    case 6: return 'Full '+RN[r1]+' par '+RN[r2];
    case 7: return 'Carré de '+RN[r1];
    default: return r1===12?'Quinte flush royale':'Quinte flush';
  }
}
function shuffledDeck(){
  const d=[]; for(let i=0;i<52;i++) d.push(i);
  for(let i=51;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=d[i]; d[i]=d[j]; d[j]=t; }
  return d;
}
// Équité Monte-Carlo contre nOpp mains aléatoires
function equity(hole,board,nOpp,sims){
  const used=new Array(52).fill(false); hole.forEach(c=>used[c]=true); board.forEach(c=>used[c]=true);
  const deck=[]; for(let c=0;c<52;c++) if(!used[c]) deck.push(c);
  const need=5-board.length, k=need+2*nOpp; let win=0;
  for(let i=0;i<sims;i++){
    for(let j=0;j<k;j++){ const r=j+((Math.random()*(deck.length-j))|0); const t=deck[j]; deck[j]=deck[r]; deck[r]=t; }
    const full=board.concat(deck.slice(0,need));
    const mine=eval7(hole.concat(full)); let lost=false, ties=1;
    for(let o=0;o<nOpp;o++){
      const sc=eval7([deck[need+2*o],deck[need+2*o+1]].concat(full));
      if(sc>mine){lost=true;break;} else if(sc===mine) ties++;
    }
    if(!lost) win+=1/ties;
  }
  return win/sims;
}
function potTotal(H){ let t=0; for(const s of H.seats) t+=s.total; return t; }
function buildPots(seats){
  const levels=[...new Set(seats.filter(s=>s.total>0).map(s=>s.total))].sort((a,b)=>a-b);
  const pots=[]; let prev=0;
  for(const lv of levels){
    let amount=0; const elig=[];
    for(const s of seats){ amount+=Math.min(s.total,lv)-Math.min(s.total,prev); if(s.total>=lv&&!s.folded) elig.push(s); }
    if(amount>0){
      if(!elig.length&&pots.length) pots[pots.length-1].amount+=amount; else pots.push({amount,elig});
    }
    prev=lv;
  }
  return pots;
}

// Petites manies humaines : certains joueurs surévaluent les mains assorties, les As, les paires...
function quirkBonus(P,hole,board){
  const r1=hole[0]%13, r2=hole[1]%13, suited=((hole[0]/13)|0)===((hole[1]/13)|0), pre=board.length===0;
  switch(P.quirk){
    case 'suited': return suited?(pre?.035:.015):0;
    case 'aces': return (r1===12||r2===12)?.03:0;
    case 'pairs': return pre?(r1===r2?.04:0):(board.some(c=>c%13===r1||c%13===r2)?.04:0);
    case 'connect': return pre&&Math.abs(r1-r2)<=1?.03:0;
  }
  return 0;
}

function botDecide(seat,H,G){
  const P=seat.p.bot, sk=G.tier.id, R=Math.random;
  const tl=P.tilt*P.tiltProne;                       // le tilt rend plus agressif et plus large
  const aggr=Math.min(1,P.aggr+.25*tl), loose=Math.min(1,P.loose+.25*tl), tight=Math.max(0,P.tight-.2*tl);
  const opp=H.seats.filter(o=>o!==seat&&!o.folded).length;
  const toCall=Math.max(0,H.currentBet-seat.bet);
  const stack=seat.p.stack, bb=H.bb, pot=potTotal(H);
  const base=1/(opp+1), pre=H.street===0;
  let eq=equity(seat.hole,H.board,opp,120+sk*40)+quirkBonus(P,seat.hole,H.board);
  eq+=(R()-.5)*(.16-sk*.025+.06*tl);
  const stackBB=stack/bb, short=stackBB<=9;
  const maxTo=seat.bet+stack, minTo=Math.min(maxTo,H.currentBet+H.minRaise);
  const clampTo=to=>{ to=Math.max(minTo,Math.min(maxTo,Math.round(to))); if(maxTo-to<bb*2||to>=maxTo*.65) to=maxTo; return to; };
  const potSize=fs=>clampTo(rnd5(H.currentBet+pick(fs)*(pot+toCall)*(R()<.06?1.5:1)));   // tailles "rondes" comme un humain
  const openSize=()=>clampTo(rnd5(bb*pick([2,2.5,2.5,3,3])));
  const reSize=()=>clampTo(rnd5(H.currentBet*pick([2.5,3,3,3.5])));
  const RAISE=to=>({type:'raise',to}), CALL={type:'call'}, FOLD={type:'fold'};
  const facingBet=toCall>0&&!(pre&&H.currentBet<=bb);

  const decide=()=>{
    if(toCall<=0){
      const strong=eq>base+(1-base)*.55;
      const valT=base+(1-base)*((pre?.14:.26)-.08*aggr+.06*tight-(short?.08:0));
      if(eq>=valT&&R()<.5+.45*aggr){
        if(short&&pre) return RAISE(maxTo);
        return RAISE(pre?openSize():potSize(strong?[.66,.75,1]:[.33,.5,.66]));
      }
      if(!pre&&H.street===1&&H.pfAggressor===seat.p.id&&R()<P.cbet*(opp>1?.7:1)) return RAISE(potSize([.33,.5,.5,.66]));   // mise de continuation
      if(eq>=valT) return CALL;
      if(!pre&&R()<P.bluff*.28) return RAISE(potSize([.5,.66]));
      return CALL;
    }
    if(!facingBet){                                   // préflop, seulement les blinds devant
      const openT=base+(1-base)*(.10-.10*aggr+.08*tight-(short?.06:0));
      const odds=toCall/(pot+toCall);
      if(eq>=openT&&R()<.55+.4*aggr) return short?RAISE(maxTo):RAISE(openSize());
      const callT=odds-.06+VPIP_T*(tight-.4)-VPIP_L*(loose-.4)-(short?.05:0);
      if(eq>=callT) return CALL;
      if(R()<loose*.1) return CALL;
      return FOLD;
    }
    const potOdds=toCall/(pot+toCall);
    const f=Math.min(1.2,toCall/Math.max(bb,pot-toCall));
    let pen=(.03+.10*f)*(.6+.8*tight)*Math.min(1,stackBB/14);
    // adaptation : on croit moins un joueur qui relance tout le temps
    if(H.lastAggr!=null&&G.model&&G.model[H.lastAggr]){
      const m=G.model[H.lastAggr], agg=(m.raises+1)/(m.acts+4);
      pen*=1+(Math.max(.5,Math.min(1.3,1-1.4*(agg-.2)))-1)*P.attn;
    }
    const need=potOdds+.01+.03*tight-.03*loose;
    const eqA=eq-pen;
    const raiseT=base+(1-base)*(.40-.09*aggr-(short?.08:0));
    if(eqA>=raiseT&&R()<.3+.6*aggr&&stack>toCall) return short?RAISE(maxTo):RAISE(pre?reSize():potSize([.66,.75,1]));
    if(eqA>=need) return CALL;
    if(eqA>=need-.05*loose&&R()<.35) return CALL;
    if(R()<P.bluff*.06&&!short&&stack>toCall) return RAISE(pre?reSize():potSize([.75,1]));
    return FOLD;
  };
  const act=decide();
  // petites erreurs humaines (moins fréquentes aux paliers élevés)
  if(R()<(.04-sk*.007)*(1+tl)){
    if(act.type==='fold'&&toCall<stack*.15) return CALL;
    if(act.type==='call'&&toCall>bb*3) return FOLD;
  }
  return act;
}
// Temps de réflexion : rapide sur les décisions évidentes, plus long sur les gros coups
function thinkMs(P,act,H,seat){
  const toCall=Math.max(0,H.currentBet-seat.bet), pot=potTotal(H), R=Math.random;
  let t;
  if(act.type==='fold') t=toCall<=H.bb*1.2?550+R()*700:900+R()*1500;
  else if(act.type==='call') t=toCall<=0?500+R()*900:900+R()*1600;
  else t=1100+R()*1900;
  const big=toCall>=pot*.4||toCall>=seat.p.stack*.5||(act.type==='raise'&&act.to>=seat.bet+seat.p.stack);
  if(big&&R()<.7) t+=1200+R()*2200;
  if(R()<.06) t+=2500+R()*2500;
  return Math.min(7000,t*P.speed);
}

function botDecidePF(seat,H,G){
  const P=seat.p.bot, R=Math.random, sk=G.tier.id;
  const opp=H.seats.filter(o=>o!==seat&&!o.folded).length;
  const toCall=Math.max(0,H.currentBet-seat.bet), stack=seat.p.stack, bb=H.bb, pot=potTotal(H);
  if(toCall<=0) return {type:'call'};
  let eq=equity(seat.hole,H.board,opp,150+sk*40)+quirkBonus(P,seat.hole,H.board);
  eq+=(R()-.5)*(.14-sk*.02);
  const base=1/(opp+1);
  if(H.currentBet>bb){                                   // face à un tapis : cote de pot
    const odds=toCall/(pot+toCall);
    return eq>=odds+.02+.05*P.tight-.05*P.loose?{type:'call'}:{type:'fold'};
  }
  const stackBB=stack/bb;                                 // premier à parler : tapis ou fold
  const t=base+(1-base)*(.12+.02*Math.max(0,stackBB-8)+.06*P.tight-.07*P.aggr);
  return eq>=t?{type:'raise',to:seat.bet+stack}:{type:'fold'};
}
function sanitize(act,s,H,G){
  const toCall=Math.max(0,H.currentBet-s.bet), stack=s.p.stack;
  if(G&&G.mode==='pushfold'&&act){
    if(act.type==='raise') act={type:'raise',to:s.bet+stack};
    else if(act.type==='call'&&toCall>0&&!H.seats.some(o=>o!==s&&o.allin&&!o.folded)&&H.currentBet<=H.bb) act={type:'fold'};
  }
  if(!act||act.type==='fold') return toCall<=0?{type:'call'}:{type:'fold'};
  if(act.type==='raise'){
    if(stack<=toCall) return {type:'call'};
    const maxTo=s.bet+stack, minTo=Math.min(maxTo,H.currentBet+H.minRaise);
    let to=Math.round(act.to); if(!isFinite(to)) return {type:'call'};
    to=Math.max(minTo,Math.min(maxTo,to));
    if(to<=H.currentBet) return {type:'call'};
    return {type:'raise',to};
  }
  return {type:'call'};
}
function putChips(s,a){ s.p.stack-=a; s.bet+=a; s.total+=a; if(s.p.stack<=0){ s.p.stack=0; s.allin=true; } }
function applyAct(s,act,H,G){
  G.model=G.model||{};
  const m=G.model[s.p.id]||(G.model[s.p.id]={acts:0,raises:0,hands:0,vpip:0,pfr:0,calls:0,folds:0}); m.acts++;
  const tc0=Math.max(0,H.currentBet-s.bet);
  if(H.street===0&&!s.pfDone){ s.pfDone=true; m.hands++; if(act.type==='raise'){ m.vpip++; m.pfr++; } else if(act.type==='call'&&tc0>0) m.vpip++; }
  if(act.type==='fold'){ s.folded=true; s.last='Couché'; m.folds++; }
  else if(act.type==='call'){
    const toCall=tc0, a=Math.min(toCall,s.p.stack); putChips(s,a);
    if(toCall>0) m.calls++;
    s.last=toCall<=0?'Check':(s.allin?'TAPIS':'Suit '+a);
  } else {
    m.raises++;
    const label=H.currentBet>0?'Relance ':'Mise ';
    const a=act.to-s.bet, size=act.to-H.currentBet; putChips(s,a);
    if(size>=H.minRaise){ H.minRaise=size; for(const o of H.seats) if(o!==s&&!o.folded&&!o.allin) o.acted=false; }
    H.currentBet=Math.max(H.currentBet,act.to);
    H.lastAggr=s.p.id; if(H.street===0) H.pfAggressor=s.p.id;
    s.last=s.allin?'TAPIS':label+act.to;
  }
  s.acted=true;
  if(H.log) H.log.push({st:H.street,id:s.p.id,t:s.last});
}

async function bettingRound(G,H,start){
  const {seats,n}=H, ui=G.ui; let i=start, guard=0;
  for(const s of seats) s.acted=false;
  while(guard++<300){
    const live=seats.filter(s=>!s.folded);
    if(live.length<2) return;
    const can=live.filter(s=>!s.allin);
    if(can.length===0) return;
    if(can.length===1&&can[0].bet>=H.currentBet) return;
    if(can.every(s=>s.acted&&s.bet===H.currentBet)) return;
    const s=seats[i%n]; i++;
    if(s.folded||s.allin) continue;
    if(s.acted&&s.bet===H.currentBet) continue;
    H.turn=s.p.id; ui.render();
    let act;
    if(s.p.human) act=await ui.askHuman(s,H);
    else { act=(G.mode==='pushfold'?botDecidePF:botDecide)(s,H,G); await ui.sleep(thinkMs(s.p.bot,act,H,s)); }
    if(G.aborted) throw ABORT;
    act=sanitize(act,s,H,G);
    applyAct(s,act,H,G);
    H.turn=-1; ui.render();
    if(ui.sfx) ui.sfx(act.type==='fold'?'fold':(s.last==='Check'?'check':'chip'));
    if(act.type==='raise'&&s.allin){
      if(s.p.bot) maybeChat(G,s.p,'shove');
      else for(const o of seats) if(o!==s&&!o.folded) maybeChat(G,o.p,'heroShove');
    }
    await ui.sleep(250);
  }
}

async function playHand(G){
  const ui=G.ui;
  G.handNo++;
  const lvl=Math.min(BLINDS.length-1,(G.startLevel||0)+Math.floor((G.handNo-1)/HANDS_PER_LEVEL));
  const levelUp=lvl!==G.level; G.level=lvl;
  const [sb,bb]=BLINDS[lvl];
  do{ G.button=(G.button+1)%3; }while(G.players[G.button].stack<=0);
  const seats=[];
  for(let k=0;k<3;k++){
    const p=G.players[(G.button+k)%3];
    if(p.stack>0){ p.startStack=p.stack; seats.push({p,hole:[],bet:0,total:0,folded:false,allin:false,acted:false,last:''}); }
  }
  const n=seats.length, deck=shuffledDeck();
  const H={seats,n,sb,bb,board:[],currentBet:0,minRaise:bb,street:0,revealAll:false,showdown:false,result:null,turn:-1,deck,lastAggr:null,pfAggressor:null,log:[]};
  G.H=H;
  for(const s of seats) s.hole=[deck.pop(),deck.pop()];
  if(ui.sfx) ui.sfx('deal');
  const sbI=n===2?0:1, bbI=n===2?1:2;
  putChips(seats[sbI],Math.min(sb,seats[sbI].p.stack));
  putChips(seats[bbI],Math.min(bb,seats[bbI].p.stack));
  H.currentBet=Math.max(...seats.map(s=>s.bet));
  if(levelUp&&G.handNo>1&&ui.note) ui.note('Blinds '+sb+' / '+bb);
  if(G.handNo===1) for(const s of seats) maybeChat(G,s.p,'start');
  ui.render(); await ui.sleep(700); if(G.aborted) throw ABORT;
  const live=()=>seats.filter(s=>!s.folded);

  for(let st=0;st<4;st++){
    if(live().length<2) break;
    H.street=st;
    if(st>0){
      const cnt=st===1?3:1; for(let k=0;k<cnt;k++) H.board.push(deck.pop());
      for(const s of seats){ s.bet=0; s.acted=false; s.last=s.folded?'Couché':(s.allin?'TAPIS':''); }
      H.currentBet=0; H.minRaise=bb; H.lastAggr=null;
      if(ui.sfx) ui.sfx('deal');
      ui.render(); await ui.sleep(650); if(G.aborted) throw ABORT;
    }
    await bettingRound(G,H,st===0?(bbI+1)%n:1%n);
    if(live().length>1&&live().filter(s=>!s.allin).length<=1&&!H.revealAll){
      H.revealAll=true; ui.render(); await ui.sleep(1000); if(G.aborted) throw ABORT;
    }
  }
  // ---- résolution ----
  const alive=live(), total=potTotal(H), won=new Map(); let hands={};
  if(alive.length===1){
    alive[0].p.stack+=total; won.set(alive[0].p.id,total);
  } else {
    H.showdown=true;
    for(const s of alive) s.score=eval7(s.hole.concat(H.board));
    for(const pot of buildPots(seats)){
      const elig=pot.elig.length?pot.elig:alive;
      const best=Math.max(...elig.map(s=>s.score));
      const ws=elig.filter(s=>s.score===best);
      const share=Math.floor(pot.amount/ws.length); const rem=pot.amount-share*ws.length;
      ws.forEach((s,i)=>{ const a=share+(i<rem?1:0); s.p.stack+=a; won.set(s.p.id,(won.get(s.p.id)||0)+a); hands[s.p.id]=handLabel(s.score); });
    }
  }
  H.result={showdown:H.showdown,winners:[...won].map(([id,amount])=>({id,amount,hand:hands[id]||''}))};
  H.turn=-1;
  // humeur des bots : le tilt monte après une grosse perte, redescend sinon ; réactions dans le chat
  for(const s of seats){
    const P=s.p.bot; if(!P) continue;
    const d=s.p.stack-s.p.startStack;
    P.tilt=Math.max(0,Math.min(1,P.tilt*.75+(d<=-s.p.startStack*.3?.5:0)-(d>0?.1:0)));
    if(d>=300) maybeChat(G,s.p,'winBig'); else if(d<=-250&&H.showdown) maybeChat(G,s.p,'loseBig');
  }
  if(ui.handEnd) ui.handEnd(H);
  ui.render();
  await ui.sleep(H.showdown?3000:1500);
  if(G.aborted) throw ABORT;
}

async function runTournament(G){
  while(true){
    if(G.players.filter(p=>p.stack>0).length<2) break;
    await playHand(G);
    const aliveN=G.players.filter(p=>p.stack>0).length;
    const out=G.players.filter(p=>p.stack<=0&&!p.place).sort((a,b)=>b.startStack-a.startStack);
    out.forEach((p,i)=>{ p.place=aliveN+1+i; });
    if(aliveN<2||G.players[0].stack<=0) break;
  }
  const w=G.players.find(p=>p.stack>0); if(w&&!w.place) w.place=1;
  return {place:G.players[0].place||1};
}

  return function(){ h+=0x6D2B79F5; let t=h; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return((t^(t>>>14))>>>0)/4294967296; }; }

function dstr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function today(){ return dstr(new Date()); }
function yesterday(){ const d=new Date(); d.setDate(d.getDate()-1); return dstr(d); }

// ---------- utilitaires UI ----------
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }
let skipFn=null;
function sleep(ms){ ms=ms*SPEEDS[save.speed].f; return new Promise(res=>{ const t=setTimeout(()=>{skipFn=null;res();},ms); skipFn=()=>{clearTimeout(t);skipFn=null;res();}; }); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function showScreen(id){ $$('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); }
function modal(title,text,buttons,opt){
  opt=opt||{}; const m=$('#modal');
  m.innerHTML=`<div class="modal-box"><h3>${title}</h3>${opt.html?(text?`<div class="mbody">${text}</div>`:''):`<p>${text}</p>`}<div class="row${opt.col?' col':''}"></div></div>`;
  const row=$('.row',m);
  buttons.forEach(b=>{ const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.textContent=b.label;
    el.onclick=()=>{ m.classList.remove('show'); b.fn&&b.fn(); }; row.appendChild(el); });
  m.classList.add('show');
}
function cardHTML(c,o={}){
  let cls='card'+(o.cls?' '+o.cls:'');
  if(o.key){ if(!G.seen.has(o.key)){ G.seen.add(o.key); cls+=' pop'; } }
  if(o.back) return `<div class="${cls} back bk-${save.eq.back}"></div>`;
  if(c==null) return `<div class="card empty"></div>`;
  const s=(c/13)|0;
  return `<div class="${cls} su${s}"><span class="cr">${RANK_SYM[c%13]}</span><span class="cs">${SUITS[s]}</span></div>`;
}
// combinaisons (aide-mémoire)
function hc(str){ return str.split(' ').map(t=>RANK_SYM.indexOf(t.slice(0,-1))+13*'cdhs'.indexOf(t.slice(-1))); }
const RANKS_LIST=[['Quinte flush','5h 6h 7h 8h 9h'],['Carré','Rs Rh Rd Rc 3h'],['Full','10h 10s 10d 4c 4h'],['Couleur','Ah 9h 7h 4h 2h'],['Quinte','5c 6d 7h 8s 9c'],['Brelan','Dh Ds Dc 8h 3c'],['Double paire','Vs Vh 5d 5c Ah'],['Paire','10h 10d Ac 7s 3h'],['Carte haute','Ah Rd 9c 6s 3h']];
function ranksHTML(){ return '<div class="ranks">'+RANKS_LIST.map(([n,c],i)=>`<div class="rk"><span class="rn">${i+1}. ${n}</span><span class="rc">${hc(c).map(x=>cardHTML(x)).join('')}</span></div>`).join('')+'</div><p style="margin-top:8px;color:var(--muted)">De la plus forte à la plus faible.</p>'; }
function showRanks(back){ modal('Combinaisons',ranksHTML(),[{label:back?'Retour':'Fermer',fn:back}],{html:true}); }
function tutorial(step){
  const S=[
    ['Le principe',"<p>Spin &amp; Go : 3 joueurs, 500 jetons chacun. Le dernier debout remporte toute la cagnotte, tirée à la roue avant la partie (de ×2 à ×1000).</p>"],
    ['Un coup de poker',"<p>Tu reçois 2 cartes privées. 5 cartes communes sont dévoilées : 3 (le flop), puis 1 (le turn), puis 1 (la river). Ta meilleure combinaison de 5 cartes remporte le pot.</p>"],
    ['Tes actions',"<p><b>Se coucher</b> : tu abandonnes la main.<br><b>Check</b> : tu passes sans miser.<br><b>Suivre</b> : tu égalises la mise.<br><b>Relancer</b> : tu augmentes la mise.<br><b>Tapis</b> : tu mises tous tes jetons.</p>"],
    ['Les blinds',"<p>Deux joueurs posent des mises forcées (les blinds). Elles augmentent toutes les 5 mains : impossible d'attendre, il faut jouer !</p><p>Astuce : active « Aide au jeu » dans le menu ☰ pour voir tes chances de gagner.</p>"],
    ['Les combinaisons',ranksHTML()]
  ];
  const last=step===S.length-1;
  modal(`${S[step][0]} <small style="color:var(--muted);font-size:.6em">${step+1}/${S.length}</small>`,S[step][1],
    [{label:last?"C'est parti !":'Suivant',fn:()=>last?endTuto():tutorial(step+1)}].concat(last?[]:[{label:'Passer',cls:'ghost',fn:endTuto}]),{html:true});
}
function endTuto(){ save.tutorialDone=true; persist(); }

// ---------- HUB ----------
let tab='play', hubMode='classic', trainBoss='default';
function renderHub(){
  ensureMissions();
  $('#hubAv').textContent=avatarChar(); $('#hubAv').className='av fr-'+save.eq.frame;
  $('#hubName').textContent=save.name;
  $('#hubRank').textContent='Rang '+curTier().name+' · '+(titleText()||(save.wins+' victoire'+(save.wins>1?'s':'')));
  $('#hubCoins').innerHTML='<i class="coin"></i>'+fmt(save.coins);
  $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('.tabs [data-tab=quests]').classList.toggle('badge',save.missions.list.some(m=>m.prog>=m.target&&!m.claimed));
  $('.tabs [data-tab=club]').classList.toggle('badge',save.club.recruits.some(r=>r.job&&Date.now()>=r.job.end)||pendingIncome()>=1);
  $('#hubBody').innerHTML= tab==='play'?playTab():tab==='league'?leagueTab():tab==='quests'?questsTab():tab==='club'?clubTab():tab==='shop'?shopTab():profileTab();
}
function dailyAmount(){ const ns=(save.lastDaily===yesterday())?save.streak+1:1; return {ns,amt:500+100*Math.min(ns-1,6)}; }
function claimDaily(){
  if(save.lastDaily===today()) return;
  const {ns,amt}=dailyAmount(); save.streak=ns; save.bestStreak=Math.max(save.bestStreak,ns);
  save.coins+=amt; save.lastDaily=today(); checkAch(); persist(); renderHub(); toast(`+${fmt(amt)} jetons · série de ${ns} jour${ns>1?'s':''}`);
}
function playTab(){
  let h=''; const ev=activeEvent();
  if(ev) h+=`<div class="banner ev"><p><b>${ev.name}</b><br>${ev.desc}</p></div>`;
  if(save.lastDaily!==today()){ const {ns,amt}=dailyAmount(); h+=`<div class="banner"><p><b>Bonus du jour · série de ${ns}</b><br>${fmt(amt)} jetons t'attendent.</p><button class="btn" data-act="daily">Récupérer</button></div>`; }
  if(save.coins<TIERS[0].buyin) h+=`<div class="banner"><p><b>Plus de jetons !</b><br>Un coup de pouce pour repartir.</p><button class="btn" data-act="rescue">+300</button></div>`;
  h+=`<h2>Spin &amp; Go</h2><div class="pills"><button class="pill ${hubMode==='classic'?'on':''}" data-act="mode" data-m="classic">Classique</button><button class="pill ${hubMode==='pushfold'?'on':''}" data-act="mode" data-m="pushfold">Tapis ou fold</button><button class="pill ${hubMode==='training'?'on':''}" data-act="mode" data-m="training">Entraînement</button></div>`;
  if(hubMode==='training'){
    h+=`<p class="lead">Chaque décision est comparée à la table de stratégie. Si tu t'écartes, le coup optimal est joué à ta place à la place du tien, pour que tu voies immédiatement la différence. Gratuit, sans mise, à volonté.</p>`;
    h+='<div class="card-box" style="margin-bottom:12px"><b>Adversaire</b><div class="pills" style="margin-top:8px">';
    h+=`<button class="pill ${trainBoss==='default'?'on':''}" data-act="train-pick" data-b="default">Le Livre (standard)</button>`;
    LEAGUE.forEach((L,i)=>{ if(i<save.league.rank) h+=`<button class="pill ${trainBoss===String(i)?'on':''}" data-act="train-pick" data-b="${i}">${L.boss.name}</button>`; });
    h+='</div></div>';
    if(save.trainStats.total) h+=`<p class="lead">Précision cumulée : ${Math.round(save.trainStats.correct/save.trainStats.total*100)} % sur ${save.trainStats.total} décisions (${save.trainStats.sessions} séance${save.trainStats.sessions>1?'s':''}).</p>`;
    h+=`<button class="btn" data-act="train-play">Entrer en salle</button>`;
    return h;
  }
  h+= hubMode==='classic'
    ?`<p class="lead">3 joueurs, 500 jetons chacun, blinds qui montent toutes les 5 mains. Le vainqueur remporte toute la cagnotte, de ×2 à ×1000.</p>`
    :`<p class="lead">Version express : à ton tour, tu mises tout ton tapis ou tu te couches. Blinds élevées dès le départ, parties très courtes.</p>`;
  const next=TIERS.find(t=>save.wins<t.need);
  if(next){ const prev=[...TIERS].reverse().find(t=>t.need<=save.wins); const from=prev?prev.need:0; const pct=Math.min(100,(save.wins-from)/(next.need-from)*100);
    h+=`<div class="card-box" style="margin-bottom:12px"><b>Prochain palier : ${next.name}</b><div class="bar"><i style="width:${pct}%"></i></div><small style="color:var(--muted)">${save.wins} / ${next.need} victoires</small></div>`; }
  for(const t of TIERS){
    const unl=save.wins>=t.need, aff=save.coins>=t.buyin;
    h+=`<div class="tier ${unl?'':'locked'}" style="--tc:${t.color}">
      <div><div class="tname">${t.name}</div><div class="tbuy">${chipHTML(t.buyin)}${fmt(t.buyin)}</div></div>
      <button class="btn" data-act="play" data-tier="${t.id}" ${unl&&aff?'':'disabled'}>${unl?(aff?'Jouer':'Solde trop bas'):'🔒 '+save.wins+'/'+t.need}</button>
      <div class="tinfo">Jusqu'à ${fmt(t.buyin*1000)} à gagner</div></div>`;
  }
  if(!ev) h+=`<p class="lead">${nextEventText()}</p>`;
  return h;
}
function questsTab(){
  ensureMissions();
  const act=(save.lastDaily===today()||save.lastDaily===yesterday())?save.streak:0;
  let dots=''; for(let i=1;i<=7;i++) dots+=`<i class="${i<=Math.min(7,act)?'on':''}"></i>`;
  let h=`<h2>Défis</h2><div class="card-box"><b>Série de connexion : ${act} jour${act>1?'s':''}</b><div class="dots">${dots}</div><small style="color:var(--muted)">Record : ${save.bestStreak} · le bonus quotidien grimpe pendant 7 jours</small></div><h3>Défis du jour</h3>`;
  save.missions.list.forEach((m,i)=>{
    const t=MISSION_T.find(x=>x.k===m.k), done=m.prog>=m.target;
    h+=`<div class="mis ${m.claimed?'claimed':''}"><div class="mtxt"><b>${t.txt(m.target)}</b><div class="bar"><i style="width:${m.prog/m.target*100}%"></i></div><small>${m.prog} / ${m.target}</small></div>
      <button class="btn" data-act="claim" data-i="${i}" ${done&&!m.claimed?'':'disabled'}>${m.claimed?'Récupéré':(done?'+'+fmt(t.rw(m.target)):'<i class="coin"></i>'+fmt(t.rw(m.target)))}</button></div>`;
  });
  h+=`<h3>Succès (${save.ach.length}/${ACH.length})</h3><p class="lead">Touche un succès débloqué pour afficher son titre sous ton pseudo.</p><div class="achs">`;
  for(const a of ACH){ const u=save.ach.includes(a.id);

function shopTab(){
  let h=`<h2>Boutique</h2><p class="lead">Dépense tes gains pour personnaliser ta table.</p>`;
  for(const cat of Object.keys(SHOP)){
    h+=`<h3>${SHOP[cat].label}</h3><div class="grid2">`;
    for(const it of SHOP[cat].items){
      const owned=save.owned.includes(it.id), on=save.eq[cat]===it.id;
      const locked=it.req&&save[it.req.k]<it.req.v&&!owned;
      let pv='';
      if(cat==='back') pv=`<div class="card back bk-${it.id}"></div>`;
      else if(cat==='felt') pv=`<div class="pvfelt fl-${it.id}"></div>`;
      else if(cat==='av') pv=`<div class="pvav">${it.emoji}</div>`;
      else if(cat==='frame') pv=`<div class="av pvfr fr-${it.id}">${avatarChar()}</div>`;
      else if(cat==='fx') pv=`<div class="pvav">${it.emoji}</div>`;
      else { const sample=[4,20,37,51].map(c=>{const s=(c/13)|0;return `<div class="card su${s}"><span class="cr">${RANK_SYM[c%13]}</span><span class="cs">${SUITS[s]}</span></div>`;}).join(''); pv=`<div class="pvdeck dk-${it.id}">${sample}</div>`; }
      const btn=on?`<button class="btn ghost" disabled>Équipé</button>`
        :owned?`<button class="btn ghost" data-act="equip" data-cat="${cat}" data-id="${it.id}">Équiper</button>`
        :locked?`<button class="btn ghost" disabled>🔒 ${it.req.txt}</button>`
        :`<button class="btn" data-act="buy" data-cat="${cat}" data-id="${it.id}">${it.price?'<i class="coin"></i>'+fmt(it.price):'Débloquer'}</button>`;
      h+=`<div class="item ${on?'eq':''}"><div class="pv">${pv}</div><div class="nm">${it.name}</div>${btn}</div>`;
    }
    h+='</div>';
  }
  return h;
}
function chartSVG(){
  const pts=save.hist.map(x=>x.c); if(pts.length<2) return '<p class="lead">Joue quelques Spins pour voir la courbe de tes jetons.</p>';
  const W=300,Hh=90,min=Math.min(...pts),max=Math.max(...pts),rng=Math.max(1,max-min);
  const xy=pts.map((v,i)=>[i*(W/(pts.length-1)),Hh-5-((v-min)/rng)*(Hh-12)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" class="chart"><path d="${d} L${W} ${Hh} L0 ${Hh} Z" fill="rgba(233,185,73,.16)"/><path d="${d}" fill="none" stroke="#e9b949" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="chartlbl"><span>${fmt(min)}</span><span>${pts.length} derniers Spins</span><span>${fmt(max)}</span></div>`;
}
function rivalRead(r){
  if(!r||r.hands<RIVAL_READ) return null;
  const v=r.vpip/r.hands*100, p=r.pfr/r.hands*100;
  const a=v<38?'Sélectif':v>=53?'Large':'Équilibré', b=p>=21?'très agressif':p>=16?'agressif':p>=13?'assez actif':'passif';
  return {v,p,tag:a+(p>=21?' · Agressif':p<13?' · Passif':''),txt:`Joue ${Math.round(v)} % des mains, relance ${Math.round(p)} % · ${a.toLowerCase()}, ${b}`};
}
function rivalsHTML(){
  return RIVALS.map(r=>{
    const s=save.rivals[r.name];
    if(!s||!s.g) return `<div class="riv unk"><div class="rh"><div class="av">❔</div><div><b>Rival inconnu</b><small>Rencontré à partir du palier ${TIERS[r.minTier].name}</small></div></div></div>`;
    const rd=rivalRead(s);
    return `<div class="riv"><div class="rh"><div class="av">${r.av}</div><div><b>${r.name}</b><small>${r.bio}</small></div></div>
      <small style="margin-top:6px">Tu l'as battu ${s.beat} fois sur ${s.g}.</small>
      <small style="color:var(--gold2)">${rd?rd.txt:'Lecture en cours : '+s.hands+' / '+RIVAL_READ+' mains observées'}</small></div>`;
  }).join('');
}
function tierStatsHTML(){
  const rows=TIERS.filter(t=>save.tierStats[t.id]).map(t=>{ const s=save.tierStats[t.id];
    return `<tr><td style="color:${t.color};font-weight:700">${t.name}</td><td>${s.spins}</td><td>${s.wins}</td><td>${s.profit>=0?'+':''}${fmt(s.profit)}</td></tr>`; });
  return rows.length?`<h3>Par palier</h3><div class="card-box"><table><tr><th>Palier</th><th>Spins</th><th>Vict.</th><th>Bénéfice</th></tr>${rows.join('')}</table></div>`:'';
}
function profileTab(){
  const l=curMults(), tot=l.reduce((a,x)=>a+x.w,0); let ev=0; l.forEach(x=>ev+=x.m*x.w/tot);
  let h=`<h2>Profil</h2><div class="stats">
    <div class="stat"><b>${save.spins}</b><span>Spins joués</span></div>

  for(const x of l){ const p=x.w/tot*100; h+=`<tr><td>×${x.m}</td><td>${p>=1?p.toFixed(1).replace('.',',')+' %':'1 sur '+fmt(Math.round(100/p))}</td></tr>`; }

    <h3>Réglages</h3><div class="setrow"><button class="btn ghost" data-act="sound">Sons : ${save.sound?'activés':'coupés'}</button>

    <button class="btn ghost" data-act="money">Affichage : ${save.moneyDisplay==='bb'?'en blindes (BB)':'en jetons'}</button>
    <button class="btn ghost" data-act="tutorial">Revoir le tutoriel</button></div>
    <h3>Données</h3><button class="btn danger" data-act="reset">Tout réinitialiser</button>
    <p class="lead" style="margin-top:10px">Jetons virtuels, sans valeur réelle. Ta progression est sauvegardée sur ton appareil.</p>`;
  return h;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act;
  if(a==='tab'){ tab=el.dataset.tab; renderHub(); $('#hubBody').scrollTop=0; }
  else if(a==='play') playSpin(+el.dataset.tier,hubMode);
  else if(a==='league-play') playLeagueSpin(+el.dataset.r);
  else if(a==='train-pick'){ trainBoss=el.dataset.b; renderHub(); }
  else if(a==='train-play') playTraining(trainBoss==='default'?null:+trainBoss);
  else if(a==='mode'){ hubMode=el.dataset.m; renderHub(); }
  else if(a==='sound'){ save.sound=!save.sound; persist(); renderHub(); if(save.sound){ initAudio(); beep(660,.1,.06); } }
  else if(a==='speed'){ save.speed=(save.speed+1)%SPEEDS.length; persist(); renderHub(); }
  else if(a==='money'){ save.moneyDisplay=save.moneyDisplay==='bb'?'chips':'bb'; persist(); renderHub(); }
  else if(a==='tutorial') tutorial(0);
  else if(a==='daily') claimDaily();
  else if(a==='rescue'){ save.coins+=300; persist(); renderHub(); toast('+300 jetons'); }
  else if(a==='claim'){
    const m=save.missions.list[+el.dataset.i]; if(!m||m.claimed||m.prog<m.target) return;
    const r=MISSION_T.find(x=>x.k===m.k).rw(m.target); m.claimed=true; save.coins+=r; checkAch(); persist(); renderHub(); toast('+'+fmt(r)+' jetons');
  }
  else if(a==='title'){ save.title=el.dataset.id; persist(); renderHub(); }
  else if(a==='equip'){ save.eq[el.dataset.cat]=el.dataset.id; persist(); renderHub(); }
  else if(a==='buy'){
    const it=SHOP[el.dataset.cat].items.find(i=>i.id===el.dataset.id);
    if(it.req&&save[it.req.k]<it.req.v){ toast(it.req.txt+' pour le débloquer'); return; }
    if(save.coins<it.price){ toast('Il te manque '+fmt(it.price-save.coins)+' jetons'); return; }
    save.coins-=it.price; save.owned.push(it.id); save.eq[el.dataset.cat]=it.id; checkAch(); persist(); renderHub(); toast(it.name+' acheté et équipé');
  }
  else if(a==='renovate'){
    const rm=ROOMS.find(x=>x.id===el.dataset.room);
    if(save.coins<rm.cost){ toast('Il te manque '+fmt(rm.cost-save.coins)+' jetons'); return; }
    save.coins-=rm.cost; save.club.rooms[rm.id]=1; checkAch(); persist(); renderHub(); toast(rm.name+' rénovée !');
  }
  else if(a==='collect-income'){
    const p=Math.floor(pendingIncome()); if(p<1) return;
    save.coins+=p; save.club.lastCollect=Date.now(); persist(); renderHub(); toast('+'+fmt(p)+' jetons encaissés');
  }
  else if(a==='slot-open') slotModal();
  else if(a==='recruit-open') recruitModal(el.dataset.id);
  else if(a==='send-job') sendRecruit(el.dataset.rec,+el.dataset.tier);
  else if(a==='collect-job') collectJob(el.dataset.rec);
  else if(a==='reset') modal('Tout effacer ?','Jetons, victoires et cosmétiques seront perdus.',[{label:'Annuler',cls:'ghost'},{label:'Effacer',cls:'danger',fn:()=>{save=newSave();persist();tab='play';editingRecruit=null;renderHub();}}]);
});
document.addEventListener('input',e=>{
  if(e.target.id==='nameIn'){ save.name=(e.target.value.trim()||'Toi').slice(0,12); persist(); $('#hubName').textContent=save.name; }
  else if(['slTight','slAggr','slBluff'].includes(e.target.id)&&editingRecruit){
    const r=save.club.recruits.find(x=>x.id===editingRecruit); if(!r) return;
    const key=e.target.id==='slTight'?'tight':e.target.id==='slAggr'?'aggr':'bluff';
    r[key]=+e.target.value/100; e.target.previousElementSibling.querySelector('b').textContent=e.target.value; persist();
  }
});

// ---------- LE CLUB (salles + écurie) ----------
const ROOMS=[
  {id:'bar',name:'Le Bar',emoji:'🍸',cost:800,income:15,slot:1,tier:1,desc:"Ambiance + 1ère place d'écurie, palier Argent pour ton écurie"},
  {id:'salon',name:'Salon de jeu',emoji:'🃏',cost:5000,income:50,slot:0,tier:2,desc:"Débloque le palier Or pour ton écurie"},
  {id:'vip',name:'Salon VIP',emoji:'🥂',cost:20000,income:140,slot:1,tier:3,desc:"+1 place d'écurie, palier Platine"},
  {id:'cave',name:'Cave à vins',emoji:'🍷',cost:70000,income:380,slot:0,tier:4,desc:"Débloque le palier Diamant"},
  {id:'penthouse',name:'Penthouse',emoji:'🏙️',cost:220000,income:900,slot:1,tier:5,desc:"+1 place d'écurie, palier Légende"}
];
const CLUB_CUT=.65;
let editingRecruit=null;
function slotsUnlocked(){ return 1+ROOMS.filter(r=>save.club.rooms[r.id]).reduce((a,r)=>a+r.slot,0); }
function maxClubTier(){ let m=0; for(const r of ROOMS) if(save.club.rooms[r.id]) m=Math.max(m,r.tier); return m; }
function incomePerHour(){ return ROOMS.filter(r=>save.club.rooms[r.id]).reduce((a,r)=>a+r.income,0); }
function pendingIncome(){ const inc=incomePerHour(); if(!inc) return 0; return Math.min(8,(Date.now()-save.club.lastCollect)/3600000)*inc; }
function fmtTime(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function genericCost(){ return 500*(save.club.recruits.length+1); }
function buildRecruitBot(r){
  return {tight:r.tight,aggr:r.aggr,bluff:r.bluff,loose:Math.max(.05,Math.min(.95,1-r.tight*.8)),
    cbet:Math.max(.05,Math.min(.95,r.aggr*.7+.15)),quirk:'none',tiltProne:.3,attn:.6,tilt:0,lastChat:-9,chatty:0,speed:1};
}
function newRecruit(name,av,arch,rival){
  return {id:'r'+Date.now()+Math.floor(Math.random()*10000),name,av,arch:arch.k,rival:!!rival,
    tight:rival?arch.tight:jit(arch.tight,.05),aggr:rival?arch.aggr:jit(arch.aggr,.05),bluff:rival?arch.bluff:jit(arch.bluff,.05),
    stats:{sent:0,won:0,earned:0},job:null};
}
function hireGeneric(){
  if(save.club.recruits.length>=slotsUnlocked()){ toast('Pas de place libre dans ton écurie'); return; }
  const cost=genericCost(); if(save.coins<cost){ toast('Il te manque '+fmt(cost-save.coins)+' jetons'); return; }
  save.coins-=cost; const arch=pick(ARCH), nm=pick(NAMES), av=pick(AVATARS);
  save.club.recruits.push(newRecruit(nm,av,arch,false));
  checkAch(); persist(); renderHub(); toast(nm+' rejoint ton écurie');
}
function hireRival(name){
  const rv=RIVALS.find(r=>r.name===name), rs=save.rivals[name];
  if(!rv||!rs||rs.beat<5){ toast('Bats-le au moins 5 fois pour le recruter'); return; }
  if(save.club.recruits.some(r=>r.name===name)){ toast('Déjà dans ton écurie'); return; }
  if(save.club.recruits.length>=slotsUnlocked()){ toast('Pas de place libre dans ton écurie'); return; }
  const cost=4000; if(save.coins<cost){ toast('Il te manque '+fmt(cost-save.coins)+' jetons'); return; }
  save.coins-=cost; save.club.recruits.push(newRecruit(rv.name,rv.av,ARCH.find(a=>a.k===rv.arch),true));
  checkAch(); persist(); renderHub(); toast(rv.name+' rejoint ton écurie !');
}
function dismissRecruit(id){
  const r=save.club.recruits.find(x=>x.id===id); if(!r) return;
  if(r.job){ toast('Attends la fin de sa mission avant de le renvoyer'); return; }
  modal('Renvoyer '+r.name+' ?','Il quittera ton écurie définitivement.',
    [{label:'Annuler',cls:'ghost'},{label:'Renvoyer',cls:'danger',fn:()=>{ save.club.recruits=save.club.recruits.filter(x=>x.id!==id); persist(); renderHub(); toast(r.name+' a quitté ton écurie'); }}]);
}
function sendRecruit(id,tierId){
  const r=save.club.recruits.find(x=>x.id===id); if(!r||r.job) return;
  const tier=TIERS[tierId];
  if(tierId>maxClubTier()){ toast('Palier non débloqué pour ton écurie'); return; }
  if(save.coins<tier.buyin){ toast('Il te manque '+fmt(tier.buyin-save.coins)+' jetons'); return; }
  save.coins-=tier.buyin; persist();
  $('#modal').classList.remove('show'); toast(r.name+' part disputer un Spin '+tier.name+'…');
  const mybot=buildRecruitBot(r);
  const players=[{id:0,name:r.name,av:r.av,human:false,stack:START_STACK,bot:mybot},
    ...makeBots(tierId,2).map((b,i)=>({id:i+1,name:b.name,av:b.av,human:false,stack:START_STACK,bot:b}))];
  const Gc={tier:{id:tierId},mode:'classic',startLevel:0,level:0,players,button:Math.floor(Math.random()*3),handNo:0,aborted:false,H:null,model:{},chat:{},
    ui:{render(){},sleep:()=>Promise.resolve()}};
  runTournament(Gc).then(res=>{
    const mult=drawMult(), prizeFull=tier.buyin*mult, won=res.place===1, payout=won?Math.round(prizeFull*CLUB_CUT):0;
    r.job={tier:tierId,buyin:tier.buyin,mult,won,payout,end:Date.now()+45000+tierId*45000,collected:false};
    persist(); if(tab==='club') renderHub();
  }).catch(e=>{ console.error(e); save.coins+=tier.buyin; persist(); toast('Erreur, mise remboursée'); if(tab==='club') renderHub(); });
}
function collectJob(id){
  const r=save.club.recruits.find(x=>x.id===id); if(!r||!r.job) return;
  if(Date.now()<r.job.end){ toast('Pas encore prêt'); return; }
  const j=r.job; r.stats.sent++; if(j.won){ r.stats.won++; r.stats.earned+=j.payout; save.coins+=j.payout; save.profit+=j.payout; }
  r.job=null; checkAch(); persist(); renderHub();
  toast(j.won?r.name+' rapporte '+fmt(j.payout)+' jetons !':r.name+' est reparti bredouille.');
  if(editingRecruit===id) $('#modal').classList.remove('show');
}
function recruitModal(id){
  const r=save.club.recruits.find(x=>x.id===id); if(!r) return;
  editingRecruit=id; const busy=!!r.job;
  let html=`<p class="lead">Envoyé ${r.stats.sent} fois · ${r.stats.won} victoire${r.stats.won>1?'s':''} · <i class="coin"></i>${fmt(r.stats.earned)} rapportés</p>`;
  if(busy){
    const left=r.job.end-Date.now(), dur=45000+r.job.tier*45000, pct=Math.min(100,100-(left/dur*100));
    html+=`<div class="jobbox"><b>En mission · Palier ${TIERS[r.job.tier].name}</b><div class="bar"><i style="width:${pct}%"></i></div>
      <small id="jobLeft" data-rec="${id}">${left<=0?'Prête à récupérer !':fmtTime(left)}</small></div>
      ${left<=0?`<button class="btn" data-act="collect-job" data-rec="${id}">Collecter</button>`:''}`;
  } else {
    html+=`<div class="sliders">
      <div class="sl"><label>Prudence <b>${Math.round(r.tight*100)}</b></label><input type="range" id="slTight" min="5" max="95" value="${Math.round(r.tight*100)}"></div>
      <div class="sl"><label>Agressivité <b>${Math.round(r.aggr*100)}</b></label><input type="range" id="slAggr" min="5" max="95" value="${Math.round(r.aggr*100)}"></div>
      <div class="sl"><label>Bluff <b>${Math.round(r.bluff*100)}</b></label><input type="range" id="slBluff" min="5" max="95" value="${Math.round(r.bluff*100)}"></div>
      </div><h3 style="margin-top:14px">Envoyer jouer</h3><div class="tgrid">`+
      TIERS.map(t=>{ const locked=t.id>maxClubTier(), aff=save.coins>=t.buyin;
        return `<button class="btn ghost tbtn" data-act="send-job" data-rec="${id}" data-tier="${t.id}" ${locked||!aff?'disabled':''}>${locked?'🔒 ':''}${t.name}<br><small><i class="coin"></i>${fmt(t.buyin)}</small></button>`; }).join('')+'</div>';
  }
  modal(`${r.av} ${r.name}`,html,busy?[{label:'Fermer'}]:[{label:'Renvoyer',cls:'danger',fn:()=>dismissRecruit(id)},{label:'Fermer',cls:'ghost'}],{html:true,col:true});
}
function slotModal(){
  const opts=[{label:'Recruter un joueur ('+fmt(genericCost())+')',fn:hireGeneric}];
  RIVALS.filter(r=>save.rivals[r.name]&&save.rivals[r.name].beat>=5&&!save.club.recruits.some(x=>x.name===r.name))
    .forEach(r=>opts.push({label:'Recruter '+r.name+' (4 000)',cls:'ghost',fn:()=>hireRival(r.name)}));
  opts.push({label:'Annuler',cls:'ghost'});
  modal('Nouvelle recrue','Choisis qui rejoint ton écurie.',opts,{col:true});
}
function leagueTab(){
  const rank=save.league.rank;
  let h='<h2>Mode Histoire</h2><p class="lead">Grimpe les échelons, bats les chefs de chaque ligue et deviens le meilleur joueur de poker.</p>';
  if(rank>=LEAGUE.length){
    h+='<div class="banner"><p><b>Champion du monde !</b><br>Tu as battu tous les chefs de ligue.</p></div>';
  } else {
    const L=LEAGUE[rank], aff=save.coins>=L.buyin;
    h+=`<div class="card-box" style="margin-bottom:12px;--tc:${L.color};border-left:9px solid var(--tc)">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="av" style="width:52px;height:52px;font-size:28px">${L.boss.av}</div>
        <div><b style="font:800 18px var(--disp)">${L.boss.name}</b><br><small style="color:var(--muted)">${L.name}</small></div>
      </div>
      <p class="lead" style="margin:8px 0">${L.boss.bio}</p>
      <div class="tbuy" style="margin-bottom:8px">Buy-in : ${chipHTML(L.buyin)}${fmt(L.buyin)} · Roue du défi ×5 à ×2500</div>
      <button class="btn" data-act="league-play" data-r="${rank}" ${aff?'':'disabled'}>${aff?'Défier':'Solde trop bas'}</button>
    </div>`;
  }
  h+='<h3>Progression</h3>';
  LEAGUE.forEach((L,i)=>{
    const beaten=i<rank, cur=i===rank;
    h+=`<div class="tier ${beaten||cur?'':'locked'}" style="--tc:${L.color}">
      <div><div class="tname" style="font-size:19px">${L.boss.av} ${L.boss.name}</div><div class="tbuy" style="font-size:14px">${L.name}</div></div>
      <div>${beaten?'✅':cur?chipHTML(L.buyin)+fmt(L.buyin):'🔒'}</div></div>`;
  });
  h+='<h3>Collection</h3><p class="lead">Un objet rare gagné pour chaque chef de ligue battu.</p><div class="achs">';
  LEAGUE.forEach(L=>{
    const has=save.league.items.includes(L.item.id);
    h+=`<div class="ach ${has?'on':''}"><b>${has?L.item.emoji+' '+L.item.name:'???'}</b><span>${has?'Remporté sur '+L.name:'Bats '+L.boss.name+' pour l\u2019obtenir'}</span></div>`;
  });
  return h+'</div>';
}
function clubTab(){
  const pend=pendingIncome(), inc=incomePerHour();
  let h=`<h2>Mon Club</h2><p class="lead">Rénove les salles pour faire tourner ton club, recrute une écurie et empoche ${Math.round(CLUB_CUT*100)} % des gains de tes joueurs.</p>`;
  h+=`<div class="card-box incomebox"><div><b>Revenus en attente</b><div class="incnum"><i class="coin"></i>${fmt(Math.floor(pend))}</div><small>${fmt(inc)} jetons / heure · plafond 8 h</small></div><button class="btn" data-act="collect-income" ${pend<1?'disabled':''}>Encaisser</button></div>`;
  h+=`<h3>Salles</h3>`;
  for(const rm of ROOMS){
    const lvl=!!save.club.rooms[rm.id], aff=save.coins>=rm.cost;
    h+=`<div class="tier room ${lvl?'':'locked'}" style="--tc:${lvl?'#3ddc84':'#5b4a9e'}">
      <div><div class="tname" style="font-size:19px">${rm.emoji} ${rm.name}</div><div class="tbuy" style="font-size:15px">${lvl?'Rénovée ✓':'<i class="coin"></i>'+fmt(rm.cost)}</div></div>
      ${lvl?'<span></span>':`<button class="btn" data-act="renovate" data-room="${rm.id}" ${aff?'':'disabled'}>Rénover</button>`}
      <div class="tinfo">${rm.desc} · +${rm.income}/h</div></div>`;
  }
  h+=`<h3>Ton écurie <small style="color:var(--muted);font-size:14px;font-weight:600">(${save.club.recruits.length}/${slotsUnlocked()} places)</small></h3>
    <p class="lead">Règle le style de chaque recrue, envoie-la disputer un Spin, puis reviens encaisser sa part.</p><div class="stable">`;
  for(let i=0;i<slotsUnlocked();i++){
    const r=save.club.recruits[i];
    if(!r){ h+='<button class="slot empty" data-act="slot-open"><span>+</span><small>Recruter</small></button>'; continue; }
    let stat;
    if(r.job){ const left=r.job.end-Date.now();
      stat=left<=0?`<button class="btn" data-act="collect-job" data-rec="${r.id}" style="padding:6px 8px;font-size:14px">Collecter</button>`:`<div class="cd" data-rec="${r.id}">${fmtTime(left)}</div>`;
    } else stat='<span class="idle">Libre</span>';
    h+=`<button class="slot filled" data-act="recruit-open" data-id="${r.id}"><div class="av">${r.av}</div><b>${r.name}</b>${stat}</button>`;
  }
  return h+'</div>';
}

let G=null;
const A={active:false};
const TIPS=['Avant le flop : joue les paires, les As et les grosses cartes ; couche les mains faibles.','Flop : as-tu touché une paire ou un tirage ? Sinon, reste prudent.','Turn : chaque mise coûte plus cher, sois sélectif.','River : dernière carte. Compare ta combinaison au tableau.'];
function renderTable(){
  if(!G) return;
  const H=G.H, lvl=G.level, [sb,bb]=BLINDS[lvl];
  const inLvl=H?((G.handNo-1)%HANDS_PER_LEVEL)+1:0;
  $('#tHead').innerHTML=`<button class="quit" data-menu aria-label="Menu">☰</button>
    <div class="hctr"><b>Blinds ${sb} / ${bb}</b><small>${G.training?'Entraînement · ':(G.mode==='pushfold'?'Tapis ou fold · ':'')}Niveau ${lvl+1} · main ${inLvl}/${HANDS_PER_LEVEL}</small></div>
    <div class="hprz">${G.training?`<b>${G.trainStats.correct}/${G.trainStats.total}</b><small>précision</small>`:`<b>×${G.mult}</b><small><i class="coin"></i>${fmt(G.prize)}</small>`}</div>`;
  const opps=G.players.slice(1).map(p=>seatHTML(p,false)).join('');
  let board=''; for(let i=0;i<5;i++) board+=cardHTML(H&&H.board[i]!==undefined?H.board[i]:null,{key:H&&H.board[i]!==undefined?`${G.handNo}-b${i}`:null});
  const pot=H?potTotal(H):0;
  $('#felt').className='felt fl-'+save.eq.felt;
  $('#felt').innerHTML=`<div class="opps">${opps}</div>
    <div class="mid"><div class="pot">POT ${pot>0?chipHTML(pot):''}<b>${H?dispAmt(pot,H.bb):fmt(pot)}</b></div><div class="board">${board}</div></div>
    ${seatHTML(G.players[0],true)}`;
}
function seatHTML(p,hero){
  const H=G.H, S=H&&H.seats.find(s=>s.p.id===p.id);
  const reveal=H&&(H.showdown||H.revealAll)&&S&&!S.folded;
  const win=H&&H.result&&H.result.winners.find(w=>w.id===p.id);
  let cards='';
  if(S){
    if(hero) cards=S.hole.map((c,i)=>cardHTML(c,{key:`${G.handNo}-h${i}`})).join('');
    else cards=S.hole.map((c,i)=>reveal?cardHTML(c,{key:`${G.handNo}-r${p.id}${i}`}):cardHTML(0,{back:1,key:`${G.handNo}-o${p.id}${i}`})).join('');
  }
  const cls=['seat',hero?'hero':'',S&&S.folded?'folded':'',H&&H.turn===p.id?'turn':'',win?'win':'',(!S&&p.stack<=0)?'out':''].join(' ');
  const dealer=H&&H.seats[0].p.id===p.id&&H.n>0;
  let last=win?`+${dispAmt(win.amount,H.bb)}${win.hand?' · '+win.hand:''}`:(S?S.last:(p.stack<=0?'Éliminé':''));
  const thinking=!hero&&H&&H.turn===p.id;
  if(thinking) last='réfléchit…';
  let hl='';
  if(hero&&S&&!S.folded&&H.board.length>=3) hl=handLabel(eval7(S.hole.concat(H.board)));
  const rd=(!hero&&p.bot&&p.bot.rival)?rivalRead(save.rivals[p.name]):null;
  const bubble=G.chat&&G.chat[p.id]?`<div class="chat">${G.chat[p.id]}</div>`:'';
  return `<div class="${cls}">${bubble}<div class="betrow">${S&&S.bet>0?`<span class="bet">${chipHTML(S.bet)}${dispAmt(S.bet,H.bb)}</span>`:''}</div>
    <div class="hole">${cards}</div>
    <div class="plate">${dealer?'<span class="dbtn">D</span>':''}<div class="av${hero?' fr-'+save.eq.frame:''}">${p.av}</div><div class="pn"><div class="nm">${p.name}</div>${rd?`<div class="rd">${rd.tag}</div>`:''}<div class="stk">${H?dispAmt(p.stack,H.bb):fmt(p.stack)}</div></div></div>
    <div class="lastact ${win?'win':''} ${thinking?'think':''}">${last}</div>${hero?`<div class="hlabel">${hl}</div>`:''}</div>`;
}

function renderHandBody(hd){
  const nm=id=>G.players[id].name, streets=['Préflop','Flop','Turn','River'];
  let h=`<div class="lh"><p><b>Main n° ${hd.n}</b></p><div class="rc">${hd.board.length?hd.board.map(c=>cardHTML(c)).join(''):'<small>Pas de tableau</small>'}</div>`;
  h+=hd.seats.map(s=>`<div class="lhs"><b>${nm(s.id)}</b><span class="rc">${(s.id===0||(hd.showdown&&!s.folded))?s.hole.map(c=>cardHTML(c)).join(''):'<small>cartes cachées</small>'}</span></div>`).join('');
  for(let st=0;st<4;st++){ const ev=hd.log.filter(e=>e.st===st); if(ev.length) h+=`<p style="margin-top:8px"><b>${streets[st]}</b> : ${ev.map(e=>nm(e.id)+' '+e.t).join(' · ')}</p>`; }
  h+=`<p style="margin-top:8px;color:var(--gold2)">${hd.result.winners.map(w=>`${nm(w.id)} remporte ${fmt(w.amount)}${w.hand?' ('+w.hand+')':''}`).join(' · ')}</p></div>`;
  return h;
}
function showLastHand(){
  const lh=G&&G.lastHand;
  if(!lh){ modal('Dernière main','<p>Aucune main terminée pour le moment.</p>',[{label:'Retour',fn:openMenu}],{html:true}); return; }
  modal('Dernière main',renderHandBody(lh),[{label:'Retour',fn:openMenu}],{html:true});
}
function showKeyHand(){
  const kh=G&&G.keyHand;
  if(!kh){ modal('Main clé','<p>Pas encore de tournant identifié pour cette partie.</p>',[{label:'Retour',fn:openMenu}],{html:true}); return; }
  const swing=kh.after-kh.before;
  const intro=`<p style="margin-bottom:10px">Le tournant de la partie : tu es passé de ${fmt(kh.before)} à ${fmt(kh.after)} jetons (${swing>=0?'+':''}${fmt(swing)}).</p>`;
  modal('Main clé',intro+renderHandBody(kh),[{label:'Retour',fn:openMenu}],{html:true});
}

function coachOn(){ return false; }
function coachText(){ return ''; }

// ---- actions du joueur ----
function drawActions(){
  const bF=$('#bFold'), bC=$('#bCall'), bR=$('#bRaise');
  $('#table').classList.toggle('raising',A.active&&A.open);
  if(!A.active){ bF.disabled=bC.disabled=bR.disabled=true; $('#raisePanel').classList.add('hidden'); return; }
  bF.disabled=A.toCall<=0;
  bC.disabled=false;
  bC.textContent=A.toCall<=0?'Check':(A.toCall>=A.stack?'Tapis '+dispAmt(A.stack,A.H.bb):'Suivre '+dispAmt(A.toCall,A.H.bb));
  bR.disabled=!A.canRaise;
  if(A.pf){ bC.disabled=A.toCall>0&&!A.facingShove; bR.textContent='Tapis '+dispAmt(A.stack,A.H.bb); $('#raisePanel').classList.add('hidden'); return; }
  $('#raisePanel').classList.toggle('hidden',!A.open);
  updRaise();
}
function updRaise(){
  const bR=$('#bRaise');
  if(!A.open){ bR.textContent=A.H&&A.H.currentBet>0?'Relancer':'Miser'; return; }
  $('#rSlider').value=A.to;
  bR.textContent=A.to>=A.maxTo?'Tapis '+dispAmt(A.to,A.H.bb):(A.H.currentBet>0?'Relancer à ':'Miser ')+dispAmt(A.to,A.H.bb);
}
function setTo(v){ A.to=Math.max(A.minTo,Math.min(A.maxTo,Math.round(v))); updRaise(); }
function askHuman(seat,H){
  return new Promise(resolve=>{
    const stack=seat.p.stack, toCall=Math.max(0,H.currentBet-seat.bet);
    const maxTo=seat.bet+stack, minTo=Math.min(maxTo,H.currentBet+H.minRaise);

function beep(freq,dur,vol,delay,type){

const WHEEL=[2,3,2,5,2,4,2,3,10,2,3,2,25,2,4,2,3,2,5,2,100,3,2,1000];
const WCOL={2:['#4f7fe0','#fff'],3:['#3ddc84','#0a3320'],4:['#a85bff','#fff'],5:['#ff8bd6','#3a0f2c'],10:['#ff5c6c','#fff'],25:['#ff9d3c','#3a2308'],100:['#ffc93c','#3a2308'],1000:['#fff6e8','#e8495a'],
  8:['#3ddc84','#0a3320'],12:['#ff8bd6','#3a0f2c'],60:['#ff9d3c','#3a2308'],250:['#ffc93c','#3a2308'],2500:['#fff6e8','#e8495a']};
const TAU=Math.PI*2;
let REVEAL_MS=5200, revealSkip=false;
function drawWheel(cv,theta,hi,wheel){
  wheel=wheel||WHEEL;
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return;
  const S=cv.width, c=S/2, R=c-S*.045, n=wheel.length, seg=TAU/n;
  ctx.clearRect(0,0,S,S);
  const rim=ctx.createLinearGradient(0,0,S,S); rim.addColorStop(0,'#ffe17a'); rim.addColorStop(.5,'#ffb23c'); rim.addColorStop(1,'#ffc93c');
  ctx.beginPath(); ctx.arc(c,c,c-1,0,TAU); ctx.fillStyle=rim; ctx.fill();
  for(let i=0;i<n;i++){
    const m=wheel[i], a0=theta+i*seg-Math.PI/2, a1=a0+seg;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R,a0,a1); ctx.closePath();
    ctx.fillStyle=WCOL[m][0]; ctx.fill();
    if(hi===i){ ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill(); }
    ctx.lineWidth=S*.012; ctx.strokeStyle='#241b3d'; ctx.stroke();
    ctx.save(); ctx.translate(c,c); ctx.rotate(a0+seg/2);
    ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle=WCOL[m][1];
    const fs=m>=1000?.06:m>=100?.07:.085;
    ctx.font=`700 ${S*fs}px 'Oswald',sans-serif`;
    ctx.fillText('×'+m,R-S*.035,0); ctx.restore();
  }
  for(let i=0;i<n;i++){                     // ampoules du bord
    const a=theta*0+i*seg-Math.PI/2+seg/2, r=(R+c)/2+S*.004;
    ctx.beginPath(); ctx.arc(c+Math.cos(a)*r,c+Math.sin(a)*r,S*.011,0,TAU); ctx.fillStyle=(i%2?'#fff7d6':'#8c5a00'); ctx.fill();
  }
  const hub=ctx.createRadialGradient(c,c,0,c,c,S*.09); hub.addColorStop(0,'#fff6c8'); hub.addColorStop(1,'#ffb23c');
  ctx.beginPath(); ctx.arc(c,c,S*.085,0,TAU); ctx.fillStyle=hub; ctx.fill(); ctx.lineWidth=S*.014; ctx.strokeStyle='#241b3d'; ctx.stroke();
}
async function showReveal(tier,mult,wheel){
  wheel=wheel||WHEEL;
  const el=$('#reveal'), cv=$('#wheel'), ptr=$('#rvPtr'), num=$('#rvNum');
  $('#rvTier').textContent='Spin '+tier.name+' · mise '+fmt(tier.buyin);
  num.textContent=''; num.className='rv-num'; $('#rvPrize').innerHTML='&nbsp;'; $('#rvHint').textContent='Touche pour accélérer';
  el.classList.add('show'); revealSkip=false; el.onclick=()=>{ revealSkip=true; };
  const css=cv.parentElement.clientWidth||300, dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=cv.height=Math.round(css*dpr);
  const n=wheel.length, seg=TAU/n;
  const cand=[]; wheel.forEach((m,i)=>{ if(m===mult) cand.push(i); });
  const k=cand[(Math.random()*cand.length)|0];
  const off=(.1+Math.random()*.8)*seg;                          // on peut s'arrêter tout près d'une frontière
  const target=(5+Math.floor(Math.random()*3))*TAU-(k*seg+off);
  drawWheel(cv,0,-1,wheel); await wait(REVEAL_MS>1000?600:5);
  let last=-1;
  await new Promise(res=>{
    const t0=performance.now();
    (function frame(now){
      let t=Math.min(1,(now-t0)/REVEAL_MS); if(revealSkip) t=1;
      const th=target*(1-Math.pow(1-t,4));
      drawWheel(cv,th,-1,wheel);
      const idx=Math.floor((((-th)%TAU)+TAU)%TAU/seg);
      if(idx!==last){ if(last>=0&&!revealSkip){ beep(820+Math.random()*120,.035,.05,0,'square'); ptr.style.setProperty('--fl','-24deg'); setTimeout(()=>ptr.style.setProperty('--fl','0deg'),70); try{navigator.vibrate&&navigator.vibrate(6);}catch(e){} } last=idx; }
      if(t<1) requestAnimationFrame(frame); else res();
    })(performance.now());
  });
  for(let i=0;i<6;i++){ drawWheel(cv,target,i%2?-1:k,wheel); await wait(REVEAL_MS>1000?140:2); }
  drawWheel(cv,target,k,wheel);
  num.textContent='×'+mult; num.className='rv-num land'+(mult>=25?' big':'');
  $('#rvPrize').innerHTML='<i class="coin"></i>'+fmt(tier.buyin*mult)+' pour le vainqueur';
  $('#rvHint').textContent=mult>=25?'Cagnotte exceptionnelle !':'Bonne chance !';
  jingle(mult>=25);
  await wait(REVEAL_MS>1000?(mult>=25?2600:1700):5);
  el.onclick=null; el.classList.remove('show');
}

function handSnapshot(H){

function onHandEnd(H){
  try{
    const hs=H.seats.find(s=>s.p.human); if(!hs) return;
    const w=H.result.winners.find(x=>x.id===0);
    if(!G.training){
      track('hands');
      if(w){
        track('handsWon'); if(H.showdown) track('showdowns');
        if(hs.allin&&H.showdown) track('allinWon');
        if(w.amount>=400) track('bigPot');
        if(w.amount>save.bestPot){ save.bestPot=w.amount; persist(); }
        if(H.showdown&&hs.score!=null&&Math.floor(hs.score/1048576)>=5) track('strongHand');
        try{ navigator.vibrate&&navigator.vibrate([30,40,30]); }catch(e){}
      }
      for(const p of G.players) if(!p.human&&p.stack<=0&&!p.counted){ p.counted=true; if(w) track('bust'); }
    }
    G.lastHand=handSnapshot(H);
    // la main clé : le plus grand retournement (à la hausse ou à la baisse) du tapis du héros sur toute la partie
    const delta=hs.p.stack-hs.p.startStack;

  r.classList.add('show');
  if(won){ confetti(r); jingle(mult>=25); }
  if(kh) $('#rKey').onclick=showKeyHand;
  $('#rAgain').onclick=()=>{ r.classList.remove('show'); G=null; playSpin(tier.id,mode); };
  $('#rMenu').onclick=()=>{ r.classList.remove('show'); G=null; showScreen('hub'); renderHub(); };
}
const FX={fx0:null,fx1:['🪙'],fx2:['⭐','✨'],fx3:['🎆','🎇','✨','💥']};
function confetti(host){
  const set=FX[save.eq.fx];
  for(let i=0;i<40;i++){
    const s=document.createElement('i'); s.className='cf'+(set?' em':'');
    if(set) s.textContent=set[i%set.length];
    s.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*.7}s;animation-duration:${1.7+Math.random()*1.5}s;`+(set?`font-size:${16+Math.random()*16}px`:`background:hsl(${Math.random()*360} 85% 60%)`);
    host.appendChild(s); setTimeout(()=>s.remove(),3800);
  }
}
document.addEventListener('gesturestart',e=>e.preventDefault());
ensureMissions();
welcomeBack();
renderHub();
if(!save.tutorialDone) setTimeout(()=>tutorial(0),350);
</script>
